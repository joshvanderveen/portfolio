name: Deploy enquiry Worker
# Deploys the enquiry Worker (worker/) when its code changes on main, or on demand from the Actions tab.
on:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/workers.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workers
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WRANGLER_SEND_METRICS: 'false'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Deploy enquiry Worker
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy --config worker/wrangler.jsonc
